# Inspired by https://github.com/savonet/build-and-test-ocaml-module/blob/main/action.yml
# Thanks for the savonet team for building such an amazing software :p
name: Build

on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, synchronize, reopened]

env:
  DUNE_VERSION: "3.24.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # , macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install libsndfile, libsamplerate, librubberband and libsoxr
        run: |
            sudo apt-get update
            sudo apt-get install -y pkg-config libsndfile-dev libsamplerate0-dev librubberband-dev libsoxr-dev
        shell: bash

      - name: Install dune
        run: |
            curl -fsSL https://get.dune.build/install | sh -s -- --release "$DUNE_VERSION"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash

      # Holds the solved opam repository, the fetched sources and the OCaml
      # toolchain dune builds itself. Without it, every run rebuilds the compiler.
      - name: Cache the dune package management artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/dune
          key: dune-${{ matrix.os }}-${{ env.DUNE_VERSION }}-${{ hashFiles('dune-project') }}
          restore-keys: |
            dune-${{ matrix.os }}-${{ env.DUNE_VERSION }}-

      - name: Lock the dependencies
        run: dune pkg lock
        shell: bash

      - name: Build SoundML
        run: dune build
        shell: bash

      # Compile-only gate for the thumper suite: the bench alias itself runs
      # the benches against the committed machine-specific baseline, so CI
      # only checks that the benchmarks keep building (see bench/README.md).
      - name: Build the benchmarks
        run: dune build bench/bench_soundml.exe
        shell: bash
