# Inspired by https://github.com/savonet/build-and-test-ocaml-module/blob/main/action.yml
# Thanks for the savonet team for building such an amazing software :p

name: Test

on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, synchronize, reopened]

env:
  DUNE_VERSION: "3.24.1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # , macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install libsndfile
        run: |
            sudo apt-get update
            sudo apt-get install -y pkg-config libsndfile-dev
        shell: bash

      - name: Install dune
        run: |
            curl -fsSL https://get.dune.build/install | sh -s -- --release "$DUNE_VERSION"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Cache the dune package management artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/dune
          key: dune-${{ matrix.os }}-${{ env.DUNE_VERSION }}-${{ hashFiles('dune-project') }}
          restore-keys: |
            dune-${{ matrix.os }}-${{ env.DUNE_VERSION }}-

      - name: Lock dune packages
        run: dune pkg lock
        shell: bash

      - name: Run tests
        run: dune runtest
        shell: bash
