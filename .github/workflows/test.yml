# Inspired by https://github.com/savonet/build-and-test-ocaml-module/blob/main/action.yml
# Thanks for the savonet team for building such an amazing software :p

name: Test

on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, synchronize, reopened]

env:
  DUNE_VERSION: "3.24.2"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest runs on Apple Silicon: arm64 fuses multiply-adds that
        # x86_64 never does, so each platform's bits are checked on their own.
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install libsndfile
        if: runner.os == 'Linux'
        run: |
            sudo apt-get update
            sudo apt-get install -y pkg-config libsndfile-dev
        shell: bash

      - name: Install libsndfile
        if: runner.os == 'macOS'
        run: brew install pkg-config libsndfile
        shell: bash

      - name: Install dune
        run: |
            curl -fsSL https://get.dune.build/install | sh -s -- --release "$DUNE_VERSION"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Cache the dune package management artifacts
        uses: actions/cache@v6
        with:
          path: ~/.cache/dune
          key: dune-${{ matrix.os }}-${{ env.DUNE_VERSION }}-${{ hashFiles('dune-project') }}
          restore-keys: |
            dune-${{ matrix.os }}-${{ env.DUNE_VERSION }}-

      - name: Lock dune packages
        run: dune pkg lock
        shell: bash

      - name: Run tests
        run: dune runtest
        shell: bash
